{
  "01_transcriber": {
    "args": [
      "--model",
      "{model}",
      "--language",
      "{language}",
      "--device",
      "{device}",
      "--compute_type",
      "{compute_type}",
      "{input_file}",
      "--output_format",
      "json"
    ],
    "defaults": {
      "compute_type": "int8",
      "device": "cuda",
      "language": null,
      "model": "base"
    },
    "executable": "faster-whisper",
    "output_parser": "faster_whisper_json"
  },
  "02_review": {
    "args": [
      "--model",
      "{model}",
      "--language",
      "{language}",
      "--device",
      "{device}",
      "--compute_type",
      "{compute_type}",
      "{input_file}",
      "--output_format",
      "json"
    ],
    "defaults": {
      "compute_type": "int8",
      "device": "cpu",
      "language": null,
      "model": "base"
    },
    "enabled": true,
    "executable": "faster-whisper",
    "output_parser": "faster_whisper_json"
  },
  "03_cut_command": [
    "ffmpeg",
    "-y",
    "-i",
    "{input_file}",
    "-ss",
    "{start_time}",
    "-t",
    "{duration}",
    "-c:v",
    "{vcodec}",
    "-preset",
    "{preset}",
    "-crf",
    "{crf}",
    "-g",
    "{gop}",
    "-c:a",
    "{acodec}",
    "-b:a",
    "{audio_bitrate}",
    "{output_file}"
  ],
  "04_concat_command": [
    "ffmpeg",
    "-y",
    "-f",
    "concat",
    "-safe",
    "0",
    "-i",
    "{concat_list}",
    "-c",
    "copy",
    "{output_file}"
  ],
  "05_ffmpeg_defaults": {
    "acodec": "aac",
    "audio_bitrate": "256k",
    "crf": 18,
    "extra_args": [],
    "gop": 1,
    "preset": "fast",
    "vcodec": "libx264"
  },
  "06_cutting_params": {
    "internal_pad": 0.1,
    "max_pad": 0.3
  },
  "07_editor": "nano",
  "_comment": "Save this file in the Texideo project root. GPU will fall back to CPU if CUDA fails."
}